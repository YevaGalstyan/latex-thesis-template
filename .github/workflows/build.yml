# Builds main.pdf on every push and pull request.
# Download it under: Actions → latest run → Artifacts → thesis-pdf
# Pushing a tag like v1.0 also attaches the PDF to a GitHub Release.

name: Build PDF

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compile with latexmk (TeX Live full)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: main.pdf

      - name: Attach the PDF to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: main.pdf